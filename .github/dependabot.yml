# Bagimlilik guncellemeleri. Kilit dosyasi depoda; Dependabot hem package.json
# araliklarini hem package-lock.json'u gunceller ve her PR'in CI'i kilitle calisir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript 7: @sveltejs/kit ve svelte-check peer araligi ^6'da bitiyor,
      # kurulum ERESOLVE ile duser. Ikisi destekleyince kaldir.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # tailwindcss 4: PostCSS eklentisi ayri pakete (@tailwindcss/postcss) tasindi,
      # yapilandirma bicimi degisti. Kendi basina bir goc isi; otomatik PR ile gelmez.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'bagimlilik'
    groups:
      # Tek tek PR yerine gruplanmis guncelleme: svelte/vite ekosistemi zaten
      # birlikte surum atliyor, ayri PR'lar yalnizca gurultu uretir.
      #
      # Ana surumler bilerek gruba alinmiyor: tailwindcss 3->4 ile typescript
      # 6->7 tek PR'da birlestiginde iki kirici degisiklik ayni anda geliyor ve
      # hangisinin kirdigi anlasilmiyor. Grup disinda kalan ana surumler yine
      # kendi PR'lariyla geliyor, sadece tek tek.
      svelte:
        patterns: ['svelte', 'svelte-*', '@sveltejs/*']
        update-types: ['minor', 'patch']
      arac-zinciri:
        patterns: ['vite', 'vitest', 'typescript', 'tailwindcss', 'postcss', 'autoprefixer', '@types/*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'docker'
    ignore:
      # Node'un ana surum atlamalari elle yapiliyor: Dependabot LTS olup
      # olmadigini bilmiyor ve tek numarali surumleri (23, 25) de onerir.
      # Test paketi ayrica Node 22.12+ gerektiriyor (bkz. package.json engines).
      - dependency-name: node
        update-types: ['version-update:semver-major']
