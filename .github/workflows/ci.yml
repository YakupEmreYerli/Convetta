# Her push ve PR'da: tip kontrolu, testler, uretim derlemesi ve Docker imaji.
#
# Docker isi ayri tutuluyor cunku asil degeri Dockerfile'daki ImageMagick
# kodlayici dogrulamasi: eksik bir kodlayici calisma zamaninda sessizce bos
# cikti uretir, burada ise build'i kirar ve sorun uretime hic ulasmaz.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ayni dal ustune yeni push gelirse onceki calisma iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kontrol:
    name: Tip kontrolu, test ve derleme (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" alt sinirini ve konteynerdeki surumu birlikte
        # dogrular. Node 20 listede degil: jsdom 30'un icindeki undici,
        # worker_threads.markAsUncloneable'i cagiriyor ve o API Node 22.10 ile
        # geldi - test paketi Node 20'de hic ayaga kalkmiyor.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # setup-node onbellegi bir kilit dosyasi ister; package-lock.json
          # bilerek depoya girmiyor (bkz. .gitignore), bu yuzden kapali.

      # npm ci degil: kilit dosyasi depoda yok. Dockerfile da ayni komutu kullaniyor.
      - run: npm install --no-audit --no-fund

      - name: Tip kontrolu
        run: npm run check

      - name: Testler
        run: npm test

      - name: Uretim derlemesi
        run: npm run build

  docker:
    name: Docker imaji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Yalnizca derlenir, hicbir yere itilmez: amac Dockerfile'in ve
      # ImageMagick kodlayici dogrulamasinin bozulmadigini gormek.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: convetta:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Konteyner ayaga kalkiyor mu
        run: |
          docker run -d --name convetta-ci -p 8787:8787 convetta:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null; then
              echo "Sunucu yanit veriyor."
              exit 0
            fi
            sleep 1
          done
          echo "Sunucu 30 saniyede yanit vermedi."
          docker logs convetta-ci
          exit 1

      - if: always()
        run: docker rm -f convetta-ci || true
