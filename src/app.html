<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/images/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/images/apple-touch-icon.png" />
		<meta name="theme-color" content="#2864EC" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/poppins-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/poppins-700-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Tema ilk boyamadan once uygulanir; aksi halde koyu temada acilista
			// beyaz bir parlama olusur. Dil adresten geliyor (bkz. hooks.server.ts).
			(function () {
				var theme = null;
				try {
					theme = localStorage.getItem('convetta:theme');
				} catch (e) {
					/* localStorage kapalıysa yalnızca bu okuma atlanır; aşağıdaki sistem tercihi yine denenir */
				}
				var systemDark = false;
				try {
					systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
				} catch (e) {
					/* matchMedia yoksa varsayılanla devam edilir */
				}
				if (theme === 'dark' || (!theme && systemDark)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
