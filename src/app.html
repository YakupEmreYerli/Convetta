<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/images/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/images/apple-touch-icon.png" />
		<meta name="theme-color" content="#2864EC" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/poppins-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/poppins-700-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Tema ilk boyamadan once uygulanir; aksi halde koyu temada acilista
			// beyaz bir parlama olusur. Dil adresten geliyor (bkz. hooks.server.ts).
			(function () {
				try {
					var theme = localStorage.getItem('convetta:theme');
					if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {
					/* localStorage kapaliysa varsayilanlarla devam edilir */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
